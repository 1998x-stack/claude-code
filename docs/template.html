<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}} - Claude Code 源码解析</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #111111;
            --bg-tertiary: #1a1a1a;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --accent-cyan: #00ffff;
            --accent-purple: #8b5cf6;
            --accent-pink: #ec4899;
            --accent-green: #10b981;
            --border-color: #333333;
            --shadow-glow: 0 0 20px rgba(0, 255, 255, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.7;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(139, 92, 246, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(236, 72, 153, 0.1) 0%, transparent 20%),
                repeating-linear-gradient(45deg, rgba(0,0,0,0.1) 0px, rgba(0,0,0,0.1) 1px, transparent 1px, transparent 11px),
                repeating-linear-gradient(-45deg, rgba(0,0,0,0.1) 0px, rgba(0,0,0,0.1) 1px, transparent 1px, transparent 11px);
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
            padding: 1rem 2rem;
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--accent-cyan);
            text-shadow: var(--shadow-glow);
            letter-spacing: 2px;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-links a:hover {
            color: var(--accent-cyan);
            text-shadow: 0 0 10px var(--accent-cyan);
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--accent-cyan);
            transition: width 0.3s ease;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        /* Main Content */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 6rem 2rem 4rem;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 4rem;
            animation: fadeInDown 1s ease;
        }

        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
            letter-spacing: 3px;
        }

        .header .subtitle {
            font-size: 1.2rem;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto;
        }

        /* Article */
        .article {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 3rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            animation: fadeInUp 1s ease 0.2s both;
        }

        .article h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            color: var(--accent-cyan);
            margin: 2rem 0 1rem;
            border-bottom: 2px solid var(--accent-purple);
            padding-bottom: 0.5rem;
        }

        .article h3 {
            font-size: 1.5rem;
            color: var(--accent-purple);
            margin: 1.5rem 0 0.75rem;
        }

        .article h4 {
            font-size: 1.2rem;
            color: var(--accent-pink);
            margin: 1rem 0 0.5rem;
        }

        .article p {
            margin-bottom: 1.5rem;
            color: var(--text-primary);
        }

        .article blockquote {
            border-left: 4px solid var(--accent-green);
            padding-left: 1.5rem;
            margin: 2rem 0;
            font-style: italic;
            color: var(--text-secondary);
            background: var(--bg-tertiary);
            padding: 1.5rem;
            border-radius: 0 8px 8px 0;
        }

        .article code {
            background: var(--bg-tertiary);
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            color: var(--accent-green);
            font-size: 0.9rem;
        }

        .article pre {
            background: var(--bg-tertiary);
            padding: 1.5rem;
            border-radius: 8px;
            overflow-x: auto;
            margin: 1.5rem 0;
            border: 1px solid var(--border-color);
        }

        .article pre code {
            background: none;
            padding: 0;
            color: var(--accent-cyan);
        }

        .article ul, .article ol {
            margin: 1.5rem 0;
            padding-left: 2rem;
        }

        .article li {
            margin-bottom: 0.5rem;
        }

        .article table {
            width: 100%;
            border-collapse: collapse;
            margin: 2rem 0;
            background: var(--bg-tertiary);
            border-radius: 8px;
            overflow: hidden;
        }

        .article th {
            background: var(--accent-purple);
            color: white;
            padding: 1rem;
            text-align: left;
            font-weight: 700;
        }

        .article td {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .article tr:hover {
            background: rgba(139, 92, 246, 0.1);
        }

        .article hr {
            border: none;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
            margin: 3rem 0;
        }

        /* Series Index */
        .series-index {
            background: linear-gradient(135deg, var(--bg-tertiary), var(--bg-secondary));
            border: 1px solid var(--accent-purple);
            border-radius: 12px;
            padding: 2rem;
            margin: 2rem 0;
        }

        .series-index h3 {
            color: var(--accent-cyan);
            margin-bottom: 1rem;
        }

        .series-index ul {
            list-style: none;
            padding: 0;
        }

        .series-index li {
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--border-color);
        }

        .series-index li:last-child {
            border-bottom: none;
        }

        .series-index a {
            color: var(--text-primary);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .series-index a:hover {
            color: var(--accent-cyan);
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 4rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border-color);
            color: var(--text-secondary);
        }

        /* Animations */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2.5rem;
            }
            
            .nav-links {
                display: none;
            }
            
            .article {
                padding: 2rem;
            }
            
            .container {
                padding: 5rem 1rem 3rem;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--accent-purple);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-cyan);
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-container">
            <div class="logo">CLAUDE CODE</div>
            <ul class="nav-links">
                <li><a href="index.html">首页</a></li>
                <li><a href="01_overview_architecture.html">架构概览</a></li>
                <li><a href="02_agent_engine_tools.html">Agent引擎</a></li>
                <li><a href="03_memory_architecture.html">记忆系统</a></li>
                <li><a href="04_coordinator_mode.html">协调器</a></li>
                <li><a href="05_kairos_autodream.html">KAIROS</a></li>
                <li><a href="06_security_antidistillation.html">安全机制</a></li>
                <li><a href="07_terminal_renderer_features.html">终端渲染</a></li>
                <li><a href="08_engineering_summary.html">工程总结</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <header class="header">
            <h1>{{TITLE}}</h1>
            <p class="subtitle">{{SUBTITLE}}</p>
        </header>

        <article class="article">
            {{CONTENT}}
        </article>

        <footer class="footer">
            <p>© 2026 Claude Code Source Code Analysis Series | 基于泄露源码的技术教育分析</p>
        </footer>
    </div>
</body>
</html>
